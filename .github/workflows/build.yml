name: Build and deploy

on:
  push:
    branches: [main]
  # Pull requests get the build as a check, with every publishing step gated
  # off below: no registry login, no push, and the deploy job is skipped.
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    # The image only runs on photos, which is ARM, so build natively on the
    # GitHub-hosted arm64 runner.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # No registry credentials on a pull request: nothing may publish there.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same image build runs on every event; only a non-PR run pushes it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The fleet's stacks are Ansible-managed files on disk. This job asks the
  # deploy seat on mgmt to pull and recreate the stack over SSH from the
  # self-hosted runner; the seat validates the host and stacks, refuses a stack
  # the host does not declare, and prints the image id afterwards.
  #
  # This is deliberately self-contained rather than a call to the fleet's
  # reusable deploy-stack.yml: that workflow lives in the private
  # tekkifox/infrastructure-as-code repository, and GitHub does not let a public
  # repository call a reusable workflow in a private one. The duplicated lines
  # here are only transport, and the price of this repository being public.
  # The seat address is a repo secret (DEPLOY_SEAT_HOST) so no real hostname is
  # published here. The deploy key is preinstalled on the self-hosted runner at
  # $HOME/.ssh/deploy.
  deploy:
    name: Deploy oracle-mongo-backup
    needs: build
    # Never on a pull request; otherwise only from main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Ask the fleet deploy seat to deploy
        env:
          DEPLOY_SEAT_HOST: ${{ secrets.DEPLOY_SEAT_HOST }}
          TARGET_HOST: photos
          TARGET_STACKS: photos-oracle-mongo-backup
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy" -p 32 \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@"$DEPLOY_SEAT_HOST" \
            "fleet-deploy $TARGET_HOST $TARGET_STACKS deploy"
