name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    # QEMU gives both architectures from the one amd64 hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Portainer is only on the tailnet; the hosted runner has to join it
      # before the first API call.
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --hostname=gh-oracle-mongo-backup-${{ github.run_id }}

      - name: Pin the stack to this commit and redeploy
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_KEY: ${{ secrets.PORTAINER_KEY }}
          PORTAINER_ENDPOINT: ${{ vars.PORTAINER_ENDPOINT }}
          PORTAINER_STACK: ${{ vars.PORTAINER_STACK }}
          IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          set -euo pipefail
          # -k: Portainer serves a self-signed certificate on the tailnet.
          : "${PORTAINER_URL:?}" "${PORTAINER_KEY:?}" "${PORTAINER_ENDPOINT:?}" "${PORTAINER_STACK:?}"

          curl -fsSk -H "X-API-Key: $PORTAINER_KEY" "$PORTAINER_URL/api/stacks" -o /tmp/stacks.json
          ID=$(python3 -c "
          import json, os
          name = os.environ['PORTAINER_STACK']
          rows = [s for s in json.load(open('/tmp/stacks.json')) if s.get('Name') == name]
          print(rows[0]['Id'] if rows else '')
          ")
          [ -n "$ID" ] || { echo "stack '$PORTAINER_STACK' not found" >&2; exit 1; }

          # The stack's environment holds the secrets; they are not in this repo.
          curl -fsSk -H "X-API-Key: $PORTAINER_KEY" \
            "$PORTAINER_URL/api/stacks/$ID?endpointId=$PORTAINER_ENDPOINT" -o /tmp/stack.json

          python3 - <<'PY'
          import json, os
          compose = open('docker-compose.yml').read().replace(
              'image: ghcr.io/tekkifox/oracle-mongo-backup:latest',
              f"image: {os.environ['IMAGE']}")
          env = (json.load(open('/tmp/stack.json')).get('Env') or [])
          json.dump({"stackFileContent": compose, "env": env,
                     "pullImage": True, "prune": False},
                    open('/tmp/body.json', 'w'))
          PY

          curl -fsSk -X PUT -H "X-API-Key: $PORTAINER_KEY" -H 'Content-Type: application/json' \
            --data-binary @/tmp/body.json \
            "$PORTAINER_URL/api/stacks/$ID?endpointId=$PORTAINER_ENDPOINT" -o /tmp/result.json
          echo "deployed stack $ID with $IMAGE"
