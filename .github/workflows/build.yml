name: Build and deploy

on:
  push:
    branches: [main]
  # Pull requests get the build as a check, with every publishing step gated
  # off below: no registry login, no push, and the deploy job is skipped.
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    # The image only runs on photos, which is ARM, so build natively on the
    # GitHub-hosted arm64 runner.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # No registry credentials on a pull request: nothing may publish there.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same image build runs on every event; only a non-PR run pushes it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The fleet's stacks are Ansible-managed files on disk. This job joins the
  # tailnet from a GitHub-hosted runner and asks the deploy gateway to pull and
  # recreate the stack; the gateway validates the host and stacks, refuses a
  # stack the host does not declare, and prints the image id afterwards.
  #
  # The gateway key and its pinned host key are repository secrets, installed
  # for this run only. Nothing is preinstalled on a runner.
  deploy:
    name: Deploy oracle-mongo-backup
    needs: build
    # Never on a pull request; otherwise only from main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-oracle-mongo-backup-${{ github.run_id }}

      - name: Install the gateway key and its pinned host key
        env:
          GATEWAY_KEY: ${{ secrets.DEPLOY_GATEWAY_SSH_KEY }}
          GATEWAY_HOST_KEY: ${{ secrets.DEPLOY_GATEWAY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$GATEWAY_KEY" > "$HOME/.ssh/gateway"
          chmod 0600 "$HOME/.ssh/gateway"
          printf '%s\n' "$GATEWAY_HOST_KEY" > "$HOME/.ssh/gateway_known_hosts"
          chmod 0600 "$HOME/.ssh/gateway_known_hosts"

      - name: Ask the deploy gateway to deploy
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gateway" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/gateway_known_hosts" \
            -o ConnectTimeout=30 \
            deploy-hop@deploy-gateway.tail81cbd2.ts.net \
            "deploy photos photos-oracle-mongo-backup"
