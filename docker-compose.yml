# Stack for Portainer.
#
# The container stays up and crond runs the backup nightly (see crontab).
# Deploy it on a host whose address is allowed by the database's network ACL.
#
# CI builds the image and redeploys this stack, pinning the image tag to the
# commit that built it.
services:
  oracle-mongo-backup:
    image: ghcr.io/tekkifox/oracle-mongo-backup:latest
    container_name: oracle-mongo-backup
    pull_policy: always
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PREFIX: ${S3_PREFIX:-db}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
      TZ: ${TZ:-Europe/London}
      NODE_OPTIONS: --tls-max-v1.2
