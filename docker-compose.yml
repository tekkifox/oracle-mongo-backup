# Stack for Portainer.
#
# The container stays up and supercronic runs the backup nightly (see crontab).
# Deploy it on a host whose address is allowed by the database's network ACL.
#
# The image is built on the host that runs it. Once CI publishes to GHCR, change
# `image:` to ghcr.io/<owner>/oracle-mongo-backup:latest and drop
# `pull_policy: never`.
services:
  oracle-mongo-backup:
    image: oracle-mongo-backup:local
    container_name: oracle-mongo-backup
    pull_policy: never
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PREFIX: ${S3_PREFIX:-db}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
      TZ: ${TZ:-Europe/London}
      NODE_OPTIONS: --tls-max-v1.2
