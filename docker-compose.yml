# Stack for Portainer.
#
# Deployed on mgmt-01 (the ADB ACL allows that host) and scheduled internally by
# supercronic — the container stays up and runs the backup at 03:10 UTC.
#
# The image is built on the host that runs it. Once CI publishes to GHCR, change
# `image:` to ghcr.io/tekkifox/oracle-mongo-backup:latest and drop
# `pull_policy: never`.
services:
  oracle-mongo-backup:
    image: oracle-mongo-backup:local
    container_name: oracle-mongo-backup
    pull_policy: never
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PREFIX: ${S3_PREFIX:-rossmoney}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
      TZ: ${TZ:-Europe/London}
      NODE_OPTIONS: --tls-max-v1.2
